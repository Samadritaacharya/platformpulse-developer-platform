name: PlatformPulse CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: platformpulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and security tools
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -r requirements.txt --quiet
          python -m pip install pip-audit==2.9.0 bandit==1.8.6 --quiet
      - name: Dependency consistency
        run: python -m pip check
      - name: Unit tests
        run: python -m pytest -q --disable-warnings --maxfail=1
      - name: Compile application
        run: python -m compileall -q app.py platformpulse scripts
      - name: Static security analysis
        run: bandit -q -r app.py platformpulse scripts -x tests -ll
      - name: Dependency vulnerability audit
        id: audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --progress-spinner off --format json --output dependency-audit.json
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit
          path: dependency-audit.json
      - name: Enforce dependency audit
        if: steps.audit.outcome == 'failure'
        run: |
          cat dependency-audit.json
          exit 1

  ui-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and browser test dependency
        run: |
          python -m pip install -r requirements.txt --quiet
          python -m pip install selenium==4.35.0 --quiet
          google-chrome --version
      - name: Exercise all nine Streamlit views in Chrome
        id: browser_test
        continue-on-error: true
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > platformpulse-ui.log 2>&1 &
          APP_PID=$!
          echo $APP_PID > streamlit.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              break
            fi
            sleep 1
          done
          python -m scripts.ui_e2e > ui-e2e-output.txt 2>&1
      - name: Stop Streamlit and capture server log
        if: always()
        run: |
          if [ -f streamlit.pid ]; then kill $(cat streamlit.pid) || true; fi
          cat ui-e2e-output.txt 2>/dev/null || true
          cat platformpulse-ui.log 2>/dev/null || true
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-e2e-diagnostics
          path: |
            ui-e2e-output.txt
            platformpulse-ui.log
            ui-e2e-failure.png
          if-no-files-found: ignore
      - name: Enforce browser navigation test
        if: steps.browser_test.outcome == 'failure'
        run: exit 1

  streamlit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt --quiet
      - name: Start Streamlit and verify health
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/platformpulse.log 2>&1 &
          APP_PID=$!
          trap 'cat /tmp/platformpulse.log; kill $APP_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              exit 0
            fi
            sleep 1
          done
          echo "Streamlit health check failed"
          exit 1

  generated-service-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and audit tool
        run: |
          python -m pip install -r requirements.txt --quiet
          python -m pip install pip-audit==2.9.0 --quiet
      - name: Generate secure starter
        run: python -m scripts.export_demo_service --output generated
      - name: Audit generated dependencies
        id: generated_audit
        continue-on-error: true
        run: pip-audit -r generated/demo-secure-api/requirements.txt --progress-spinner off --format json --output generated-dependency-audit.json
      - name: Upload generated dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-dependency-audit
          path: generated-dependency-audit.json
      - name: Enforce generated dependency audit
        if: steps.generated_audit.outcome == 'failure'
        run: |
          cat generated-dependency-audit.json
          exit 1
      - name: Test generated service
        run: |
          python -m venv /tmp/golden-path-venv
          /tmp/golden-path-venv/bin/python -m pip install --upgrade pip --quiet
          /tmp/golden-path-venv/bin/python -m pip install -r generated/demo-secure-api/requirements.txt --quiet
          cd generated/demo-secure-api
          /tmp/golden-path-venv/bin/python -m pytest -q tests
      - name: Build and run generated container
        run: |
          docker build -t platformpulse-generated:ci generated/demo-secure-api
          docker run -d --name platformpulse-generated -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges platformpulse-generated:ci
          trap 'docker logs platformpulse-generated || true; docker rm -f platformpulse-generated || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          echo "Generated service health check failed"
          exit 1
