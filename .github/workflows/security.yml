name: PlatformPulse Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit bandit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: bandit -r platformpulse app.py pages -x tests -q
      - name: Security regression tests
        run: python -m pytest -q tests/test_ab_testing_and_security.py
