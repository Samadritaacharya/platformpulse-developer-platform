[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 10
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#315EED"
backgroundColor = "#F8FAFF"
secondaryBackgroundColor = "#EEF4FF"
textColor = "#172033"
font = "sans serif"
